apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "125m"
          limits:
            memory: "64Mi"
            cpu: "250m"
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: nginx-config
        configMap:
          name: frontend-config
      - name: html
        configMap:
          name: frontend-html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: app
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        location / {
            try_files $uri /index.html;
        }
        location /api/ {
            proxy_pass http://backend-svc:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  namespace: app
data:
  index.html: |
    <!DOCTYPE html><html><head><title>Task Manager — k8s Lab</title>
    <style>:root{--bg:#1a1a2e;--card:#16213e;--accent:#0f3460;--text:#e0e0e0;--green:#4caf50}
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg);color:var(--text);font-family:system-ui;padding:2rem;max-width:600px;margin:auto}
    h1{text-align:center;margin-bottom:2rem;color:var(--green)}
    .badge{background:var(--accent);padding:.25rem .75rem;border-radius:1rem;font-size:.75rem}
    form{display:flex;gap:.5rem;margin-bottom:2rem}
    input{flex:1;padding:.75rem 1rem;border:1px solid var(--accent);border-radius:.5rem;background:var(--card);color:var(--text);font-size:1rem}
    button{padding:.75rem 1.5rem;border:none;border-radius:.5rem;background:var(--green);color:#fff;cursor:pointer;font-weight:bold}
    ul{list-style:none}li{padding:1rem;margin-bottom:.5rem;background:var(--card);border-radius:.5rem;display:flex;justify-content:space-between;align-items:center}
    .done{text-decoration:line-through;opacity:.6}.meta{font-size:.75rem;color:#888;margin-bottom:2rem;text-align:center}
    </style></head><body><h1>📋 Task Manager</h1>
    <div class="meta"><span class="badge">k3d</span><span class="badge">Flask</span><span class="badge">Postgres</span></div>
    <form id="tf"><input id="ti" placeholder="New task..." required><button type="submit">+ Add</button></form>
    <ul id="tl"></ul>
    <script>const A='/api/tasks';async function L(){const r=await fetch(A);const t=await r.json();document.getElementById('tl').innerHTML=t.map(t=>`<li><span class="${t.done?'done':''}">${t.title}</span><span class="badge">#${t.id}</span></li>`).join('')}
    document.getElementById('tf').onsubmit=async e=>{e.preventDefault();const ti=document.getElementById('ti').value;await fetch(A,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:ti})});document.getElementById('ti').value='';L()};L()</script></body></html>
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: app
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  type: NodePort

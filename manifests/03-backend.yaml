apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-code
  namespace: app
data:
  app.py: |
    from flask import Flask, jsonify, request
    import psycopg2, os, time
    app = Flask(__name__)
    DB_HOST = os.environ.get("DB_HOST", "postgres-svc")

    def get_db():
        for _ in range(10):
            try:
                return psycopg2.connect(
                    host=DB_HOST, database=os.environ["DB_NAME"],
                    user=os.environ["DB_USER"], password=os.environ["DB_PASS"])
            except: time.sleep(2)
        raise Exception("DB not ready")

    @app.route("/health")
    def health():
        return jsonify({"status": "ok"})

    @app.route("/api/tasks", methods=["GET"])
    def list_tasks():
        conn = get_db(); cur = conn.cursor()
        cur.execute("CREATE TABLE IF NOT EXISTS tasks (id SERIAL PRIMARY KEY, title TEXT, done BOOLEAN DEFAULT false)")
        conn.commit()
        cur.execute("SELECT id, title, done FROM tasks ORDER BY id")
        rows = cur.fetchall(); cur.close(); conn.close()
        return jsonify([{"id": r[0], "title": r[1], "done": r[2]} for r in rows])

    @app.route("/api/tasks", methods=["POST"])
    def create_task():
        data = request.get_json()
        conn = get_db(); cur = conn.cursor()
        cur.execute("INSERT INTO tasks (title) VALUES (%s) RETURNING id", (data["title"],))
        row = cur.fetchone(); conn.commit(); cur.close(); conn.close()
        return jsonify({"id": row[0], "title": data["title"], "done": False}), 201

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=5000)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
      - name: install-deps
        image: python:3.12-alpine
        command: ["pip", "install", "flask", "psycopg2-binary"]
        volumeMounts:
        - name: pip-cache
          mountPath: /root/.cache/pip
      containers:
      - name: backend
        image: python:3.12-alpine
        command: ["sh", "-c", "pip install flask psycopg2-binary -q && python /code/app.py"]
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          value: "postgres-svc.app.svc.cluster.local"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        resources:
          requests:
            memory: "64Mi"
            cpu: "125m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 5
        volumeMounts:
        - name: code
          mountPath: /code
        - name: pip-cache
          mountPath: /root/.cache/pip
      volumes:
      - name: code
        configMap:
          name: backend-code
      - name: pip-cache
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: app
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP

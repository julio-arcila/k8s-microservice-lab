<!DOCTYPE html>
<html>
<head>
    <title>Task Manager — k8s Microservice Lab</title>
    <style>
        :root { --bg: #1a1a2e; --card: #16213e; --accent: #0f3460; --text: #e0e0e0; --green: #4caf50; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: system-ui; padding: 2rem; max-width: 600px; margin: auto; }
        h1 { text-align: center; margin-bottom: 2rem; color: var(--green); }
        .badge { background: var(--accent); padding: .25rem .75rem; border-radius: 1rem; font-size: .75rem; }
        form { display: flex; gap: .5rem; margin-bottom: 2rem; }
        input { flex: 1; padding: .75rem 1rem; border: 1px solid var(--accent); border-radius: .5rem; background: var(--card); color: var(--text); font-size: 1rem; }
        button { padding: .75rem 1.5rem; border: none; border-radius: .5rem; background: var(--green); color: #fff; cursor: pointer; font-weight: bold; }
        ul { list-style: none; }
        li { padding: 1rem; margin-bottom: .5rem; background: var(--card); border-radius: .5rem; display: flex; justify-content: space-between; align-items: center; }
        .done { text-decoration: line-through; opacity: .6; }
        .meta { font-size: .75rem; color: #888; margin-bottom: 2rem; text-align: center; }
    </style>
</head>
<body>
    <h1>📋 Task Manager</h1>
    <div class="meta">
        <span class="badge">k3d cluster</span>
        <span class="badge">Flask Backend</span>
        <span class="badge">PostgreSQL</span>
    </div>
    <form id="taskForm">
        <input type="text" id="taskInput" placeholder="New task..." required>
        <button type="submit">+ Add</button>
    </form>
    <ul id="taskList"></ul>
    <script>
        const API = '/api/tasks';
        async function load() {
            const res = await fetch(API);
            const tasks = await res.json();
            document.getElementById('taskList').innerHTML = tasks.map(t =>
                `<li><span class="${t.done ? 'done' : ''}">${t.title}</span> <span class="badge">#${t.id}</span></li>`
            ).join('');
        }
        document.getElementById('taskForm').onsubmit = async e => {
            e.preventDefault();
            const title = document.getElementById('taskInput').value;
            await fetch(API, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ title }) });
            document.getElementById('taskInput').value = '';
            load();
        };
        load();
    </script>
</body>
</html>
